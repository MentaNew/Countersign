[project]
name = "agent-spend-guardrail"
version = "0.1.0"
description = "Payment gateway for AI agents: signed intents, policy + semantic checks, PayPal orders, authorization receipts and a dispute desk."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "cryptography>=43",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "dispute_desk", "demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: Depends()/Field() defaults are the FastAPI and MCP SDK idiom. C408: dict() kwargs style.
ignore = ["B008", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: hits the real PayPal sandbox (needs credentials in .env)"]
