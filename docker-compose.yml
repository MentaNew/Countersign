services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail
      POSTGRES_DB: guardrail
    ports:
      - "127.0.0.1:5433:5432"  # this Mac only, not the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
