    expires_at: "2026-11-30T00:00:00Z"
  charger: &charger
    user_text: "Replace my laptop charger: a 65 W USB-C charger that works with my Dell XPS 13. Under $60, ask me above $45."
    items: [{description: "65 W USB-C laptop charger compatible with Dell XPS 13", qty: 1}]
    max_total: {amount: "60.00", currency: USD}
    merchants: [dell.com, amazon.com]
    approval_above: {amount: "45.00", currency: USD}
    expires_at: "2026-11-30T00:00:00Z"
  shoes: &shoes
    user_text: "Order Brooks Ghost 16 running shoes, men's US 10.5, regular width, max $150."
    items: [{description: "Brooks Ghost 16 men's running shoes, US size 10.5, regular (D) width", qty: 1}]
    max_total: {amount: "150.00", currency: USD}
    merchants: [brooks.com, zappos.com]
    expires_at: "2026-11-30T00:00:00Z"
  cleaning: &cleaning
    user_text: "Restock cleaning supplies: one 6-roll pack of paper towels and 2 bottles of all-purpose cleaner spray, 32 oz. Up to $40."
    items:
      - {description: "Paper towels, pack of 6 rolls", qty: 1}
      - {description: "All-purpose cleaner spray, 32 oz bottle", qty: 2}
    max_total: {amount: "40.00", currency: USD}
    merchants: [target.com]
    expires_at: "2026-11-30T00:00:00Z"
  slack: &slack
    user_text: "Add 5 Slack Pro seats on monthly billing, no more than $45."
    items: [{description: "Slack Pro plan, 1 member, billed monthly", qty: 5}]
    max_total: {amount: "45.00", currency: USD}
    merchants: [slack.com]
    expires_at: "2026-11-30T00:00:00Z"
  ink: &ink
    user_text: "Buy one Epson 212XL black ink cartridge, max $35."
    items: [{description: "Epson 212XL high-capacity black ink cartridge", qty: 1}]
    max_total: {amount: "35.00", currency: USD}
    merchants: [epson.com, amazon.com]
    expires_at: "2026-11-30T00:00:00Z"
  notebooks: &notebooks
    user_text: "Buy 12 spiral notebooks, college ruled, letter size, 70 sheets, max $30."
    items: [{description: "Spiral notebook, college ruled, 8.5 x 11 in, 70 sheets", qty: 12}]
    max_total: {amount: "30.00", currency: USD}
    merchants: [walmart.com]
    expires_at: "2026-11-30T00:00:00Z"
