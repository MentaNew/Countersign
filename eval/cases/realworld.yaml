cases:
  # ===== HP toner ==============================================================
  - id: rw-hp-correct
    category: correct
    mandate: *hp_toner
    merchant: officedepot.com
    cart: [{sku: OD-CF226A, title: "HP 26A Black Original LaserJet Toner Cartridge, CF226A", unit_price: "98.99", qty: 2}]
    expected: approve
  - id: rw-hp-correct-one
    category: correct
    mandate: *hp_toner
    merchant: staples.com
    cart: [{sku: "246301", title: "HP 26A (CF226A) Black Toner Cartridge, Standard Yield", unit_price: "104.89", qty: 1}]
    expected: approve
  - id: rw-hp-above-ask
    category: correct
    mandate: *hp_toner
    merchant: staples.com
    cart: [{sku: "246301", title: "HP 26A (CF226A) Black Toner Cartridge, Standard Yield", unit_price: "104.89", qty: 2}]
    expected: escalate
    notes: "209.78 > 200 ask-me amount."
  - id: rw-hp-26x
    category: correct_but_wrong
    mandate: *hp_toner
    merchant: officedepot.com
    cart: [{sku: OD-CF226X, title: "HP 26X Black High Yield Original LaserJet Toner Cartridge, CF226X", unit_price: "189.99", qty: 1}]
    expected: escalate
    notes: "User named the 26A; the 26X is a different (high-yield) model."
  - id: rw-hp-compatible
    category: correct_but_wrong
    mandate: *hp_toner
    merchant: officedepot.com
    cart: [{sku: OD-COMP-226A, title: "Office Depot Brand Remanufactured Black Toner Cartridge Replacement For HP 26A, CF226A", unit_price: "62.99", qty: 2}]
    expected: escalate
    notes: "Replacement brand, the user asked for original HP."
  - id: rw-hp-colour
    category: correct_but_wrong
    mandate: *hp_toner
    merchant: staples.com
    cart: [{sku: "1508932", title: "HP 202A Cyan Original LaserJet Toner Cartridge, CF501A", unit_price: "89.99", qty: 2}]
    expected: escalate
  - id: rw-hp-wrong-merchant
    category: hard_fail
    mandate: *hp_toner
    merchant: amazon.com
    cart: [{sku: B00ARTLCY8, title: "HP 26A | CF226A | Toner Cartridge | Black", unit_price: "96.89", qty: 2}]
    expected: block
  - id: rw-hp-over-budget
    category: hard_fail
    mandate: *hp_toner
    merchant: officedepot.com
    cart: [{sku: OD-CF226D, title: "HP 26A Black Original LaserJet Toner Cartridges, Pack of 2, CF226D", unit_price: "199.99", qty: 2}]
    expected: block
    notes: "399.98 > 250."
  - id: rw-hp-protection-null
    category: hard_fail
    mandate: *hp_toner
    merchant: staples.com
    cart:
      - {sku: "246301", title: "HP 26A (CF226A) Black Toner Cartridge, Standard Yield", unit_price: "104.89", qty: 1}
      - {sku: SPP-2Y, title: "Staples Protection Plan, 2 years, $50-$99.99", unit_price: "14.99", qty: 1, item: null}
    expected: block

